name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "imagens/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e empacotar
    # Xcode 27.1 (SDK do iOS 27.1): só com ele o app ocupa a tela de dentro
    # do iPhone Duo até a borda. Compilado com SDK antigo, o app aparece lá no
    # tamanho de um iPhone, centralizado, com faixas pretas dos lados.
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write   # para publicar o release "latest"

    steps:
      - uses: actions/checkout@v4

      - name: Escolher o Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Instalar XcodeGen
        run: brew install xcodegen

      # O xcframework não é versionado (são megabytes de binário). Vem do
      # cache que o workflow ffmpeg.yml preencheu; a chave é a mesma nos dois.
      - name: Restaurar FFmpeg do cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: Vendor/FFmpeg.xcframework
          key: ffmpeg-ios-${{ hashFiles('Scripts/build-ffmpeg.sh') }}

      - name: Compilar FFmpeg (só se o cache falhar)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Scripts/build-ffmpeg.sh
          ./Scripts/build-ffmpeg.sh

      - name: Carimbar o build com o commit
        run: |
          /usr/libexec/PlistBuddy -c "Set :LabPlayerBuild ${GITHUB_SHA:0:7}" App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LabPlayerBuild" App/Info.plist

      - name: Gerar projeto
        run: xcodegen generate

      - name: Compilar (sem assinar)
        run: |
          set -o pipefail
          xcodebuild \
            -project LabPlayer.xcodeproj \
            -scheme LabPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      # Assinar ad-hoc DEPOIS do xcodebuild, não durante.
      #
      # CODE_SIGNING_ALLOWED=NO deixa o binário sem o comando LC_CODE_SIGNATURE
      # no cabeçalho Mach-O (verificado: ele realmente sai ausente). O AltServer
      # teria que inserir essa estrutura ao reassinar e não consegue — o iOS
      # recusa com "spawn failed, error=85: Bad executable", sem crash report,
      # porque o processo nunca chega a nascer.
      #
      # `xcodebuild` proíbe ad-hoc no SDK de iOS ("Ad Hoc code signing is not
      # allowed with SDK 'iOS 18.5'"), mas a proibição é dele, não do codesign.
      # Assinando aqui, o binário ganha a estrutura e o AltServer só troca o
      # conteúdo pelo certificado do Apple ID. O CI segue sem certificado.
      #
      # Os frameworks embutidos primeiro, e o app por último (assinar o app
      # sela o conteúdo dele, frameworks incluídos). O MobileVLCKit chega sem
      # LC_CODE_SIGNATURE em nenhuma fatia e ainda traz armv7/armv7s, de 32
      # bits, que nenhum iPhone do iOS 17 executa. O Sideloadly tentava
      # inserir a assinatura nesse binário gordo e desistia com "macho
      # sign/edit failed (-18)". Só com arm64, e já assinado, ele só troca o
      # conteúdo.
      - name: Assinar ad-hoc
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          for fw in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            [ -e "$fw" ] || continue
            if [ -d "$fw" ]; then
              BIN="$fw/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$fw/Info.plist")"
            else
              BIN="$fw"
            fi
            echo "== $BIN: $(lipo -archs "$BIN")"
            if [ "$(lipo -archs "$BIN")" != "arm64" ]; then
              lipo "$BIN" -thin arm64 -output "$BIN.arm64"
              mv "$BIN.arm64" "$BIN"
              echo "   agora: $(lipo -archs "$BIN")"
            fi
            codesign --force --sign - --timestamp=none "$fw"
          done
          codesign --force --sign - --timestamp=none "$APP"

      - name: Conferir a assinatura
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          codesign -dvvv "$APP" 2>&1 | sed 's/^/  /'
          otool -l "$APP/LabPlayer" | grep -q LC_CODE_SIGNATURE || {
            echo "::error title=Sem LC_CODE_SIGNATURE::o app não vai abrir no aparelho — pisca e fecha"
            exit 1
          }
          echo "LC_CODE_SIGNATURE presente"
          for fw in "$APP"/Frameworks/*.framework; do
            [ -d "$fw" ] || continue
            BIN="$fw/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$fw/Info.plist")"
            otool -l "$BIN" | grep -q LC_CODE_SIGNATURE || {
              echo "::error title=Framework sem assinatura::$BIN — o Sideloadly recusa"
              exit 1
            }
            echo "$(basename "$fw"): $(lipo -archs "$BIN"), assinado"
          done

      # O log completo do job só é baixável por quem tem admin no repositório,
      # mas as *anotações* de um repo público são lidas por qualquer um. Então
      # republicamos os erros do compilador como anotação: assim dá para
      # diagnosticar a falha de fora, sem token de acesso.
      - name: Republicar erros do compilador como anotação
        if: failure()
        run: |
          python3 - <<'PY'
          import re, pathlib
          log = pathlib.Path("build.log")
          if not log.exists():
              print("::error title=Sem log::build.log não foi gerado")
              raise SystemExit(0)

          text = log.read_text(errors="replace")
          seen, errors = set(), []
          for line in text.splitlines():
              if re.search(r"(error:|fatal error:|\*\* BUILD FAILED)", line):
                  line = line.strip()
                  if line not in seen:
                      seen.add(line)
                      errors.append(line)

          if not errors:
              tail = "\n".join(text.splitlines()[-40:])
              errors = ["Nenhuma linha 'error:' encontrada. Fim do log:", tail]

          body = "\n".join(errors)[:6000]
          enc = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Erros de compilação ({len(errors)})::{enc}")
          PY

      - name: Empacotar .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/LabPlayer.app"
          test -d "$APP" || { echo "::error::App não encontrado em $APP"; exit 1; }
          mkdir -p payload/Payload
          cp -R "$APP" payload/Payload/
          (cd payload && zip -qry ../LibertyXPlayer.ipa Payload)
          ls -lh LibertyXPlayer.ipa

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: LibertyXPlayer-ipa
          path: LibertyXPlayer.ipa
          retention-days: 30
          if-no-files-found: error

      # Artefato só baixa autenticado; asset de release baixa com um curl seco.
      # Isso deixa o .ipa acessível direto do servidor de casa — nada de abrir
      # o navegador e descompactar zip a cada iteração.
      - name: Publicar release "latest"
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest LibertyXPlayer.ipa \
            --title "LibertyX Player (iPhone) — build mais recente" \
            --notes "Compilado de ${GITHUB_SHA:0:7}. Assinado ad-hoc; o AltServer/SideStore reassina no aparelho.

          Instalar:
          \`\`\`
          curl -L -o LibertyXPlayer.ipa https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/LibertyXPlayer.ipa
          Scripts/instalar-no-iphone.sh LibertyXPlayer.ipa
          \`\`\`" \
            --prerelease

  # O mesmo app, assinado com o certificado de distribuição e enviado ao
  # TestFlight. Job à parte: se o envio falhar (a Apple fora do ar, a ficha
  # do app ainda não criada), o .ipa avulso acima sai do mesmo jeito.
  #
  # O certificado, o perfil e a chave da API foram criados pela API da App
  # Store Connect (Scripts/asc.py), sem Mac, e moram nos segredos do repo.
  testflight:
    name: Enviar ao TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Escolher o Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Restaurar FFmpeg do cache
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: Vendor/FFmpeg.xcframework
          key: ffmpeg-ios-${{ hashFiles('Scripts/build-ffmpeg.sh') }}

      - name: Compilar FFmpeg (só se o cache falhar)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Scripts/build-ffmpeg.sh
          ./Scripts/build-ffmpeg.sh

      - name: Carimbar o build com o commit
        run: /usr/libexec/PlistBuddy -c "Set :LabPlayerBuild ${GITHUB_SHA:0:7}" App/Info.plist

      - name: Gerar projeto
        run: xcodegen generate

      # Um chaveiro só deste job, apagado no fim: o certificado nunca toca o
      # chaveiro do sistema da máquina.
      - name: Preparar certificado, perfil e chave da API
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/assinatura.keychain-db"
          KCP="$(openssl rand -hex 16)"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          echo "$DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

          echo "$APPSTORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/perfil.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/perfil.mobileprovision" | plutil -extract UUID raw -)
          # O Xcode 16+ procura num lugar, os anteriores no outro.
          for d in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                   "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/perfil.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "perfil $UUID"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Arquivar (assinado para a App Store)
        run: |
          set -o pipefail
          xcodebuild \
            -project LabPlayer.xcodeproj \
            -scheme LabPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -archivePath "$RUNNER_TEMP/LibertyXPlayer.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            archive 2>&1 | tee archive.log | grep -E "error:|warning: .*sign|ARCHIVE|MobileVLCKit:" || true
          test -d "$RUNNER_TEMP/LibertyXPlayer.xcarchive" || { tail -60 archive.log; exit 1; }

      - name: Exportar e enviar
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>TL99M32UV4</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.mauricio.libertyx</key><string>LibertyX Player App Store</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LibertyXPlayer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log
          grep -qiE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" export.log || {
            echo "::error title=TestFlight::$(grep -iE 'error' export.log | head -5 | tr '\n' ' ')"
            exit 1
          }
          echo "Build ${{ github.run_number }} enviado ao TestFlight"

      - name: Apagar o chaveiro
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true
