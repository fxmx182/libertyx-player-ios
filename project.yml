name: LabPlayer

options:
  bundleIdPrefix: com.mauricio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  # SMB 2/3 em Swift puro, MIT, sem dependências nativas — importa porque
  # qualquer coisa em C aqui teria que entrar no build do xcframework.
  # `FileReader.read(offset:length:)` é o que permite tocar direto do servidor
  # em vez de baixar o arquivo inteiro antes.
  SMBClient:
    url: https://github.com/kishikawakatsumi/SMBClient
    from: "0.3.1"

  # VLCKit empacotado para SPM. Vinte anos de correções em sincronia A/V,
  # buffering de rede e recuperação de erro — exatamente onde o motor próprio
  # estava falhando. Fala SMB nativamente: basta uma URL smb://.
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  LabPlayer:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        # O identificador definitivo, o mesmo do Android: é o que fica gravado
        # na App Store Connect para sempre.
        PRODUCT_BUNDLE_IDENTIFIER: com.mauricio.libertyx
        PRODUCT_NAME: LabPlayer
        INFOPLIST_FILE: App/Info.plist
        # Nenhum CODE_SIGN_ENTITLEMENTS de propósito: sem entitlements o alvo
        # continua assinável por um Apple ID gratuito.
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        # O CI troca pelo número da execução: a Apple recusa dois envios com
        # o mesmo número de build.
        CURRENT_PROJECT_VERSION: "1"
        # Assinatura do TestFlight, só no alvo do app — passada pela linha de
        # comando, valeria também para os pacotes SPM, que recusam perfil.
        # O build do .ipa avulso desliga a assinatura (CODE_SIGNING_ALLOWED=NO)
        # e não usa nada disto.
        DEVELOPMENT_TEAM: TL99M32UV4
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "LibertyX Player App Store"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/Sources/Core/FFmpegBridge.h
        # Recursivo de propósito: assim não dependemos do nome da fatia
        # (ios-arm64) que o xcodebuild escolhe ao montar o xcframework.
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/FFmpeg.xcframework/**

    # O MobileVLCKit chega com armv7/armv7s, de 32 bits, que nenhum iPhone do
    # iOS 17 executa e que a App Store recusa. Fica só o arm64, e o framework
    # é reassinado com a mesma identidade antes de o app ser assinado.
    postBuildScripts:
      - name: MobileVLCKit só com arm64
        basedOnDependencyAnalysis: false
        script: |
          FW="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/MobileVLCKit.framework"
          BIN="$FW/MobileVLCKit"
          [ "$PLATFORM_NAME" = iphoneos ] && [ -f "$BIN" ] || exit 0
          if [ "$(lipo -archs "$BIN")" != "arm64" ]; then
            lipo "$BIN" -thin arm64 -output "$BIN.arm64"
            mv "$BIN.arm64" "$BIN"
            echo "MobileVLCKit: $(lipo -archs "$BIN")"
          fi
          if [ "$CODE_SIGNING_ALLOWED" = YES ] && [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" $OTHER_CODE_SIGN_FLAGS \
              --preserve-metadata=identifier,entitlements "$FW"
          fi

    dependencies:
      - package: SMBClient
      - package: VLCKitSPM
      # Estática: nada a embarcar no bundle, só linkar.
      - framework: Vendor/FFmpeg.xcframework
        embed: false
      # Dependências que o FFmpeg exige do sistema. Faltando qualquer uma, a
      # compilação passa e o *link* quebra — por isso ficam explícitas.
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AudioToolbox.framework
      - sdk: Security.framework
